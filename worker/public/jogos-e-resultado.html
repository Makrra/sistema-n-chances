<title>N-Chances | Bolões</title>
<style>
/* Tipografia oficial da marca (ver [Descritivo] N Chances.pdf) — usada só no
   wordmark "Chances" do cabeçalho. Caminho absoluto porque esta página é
   servida em /jogos_e_resultado/ e /jogos_e_resultado/{codigo} (relativo quebraria sob /jogos_e_resultado/{codigo}). */
@font-face {
  font-family: 'RBNo3.1';
  src: url('/fonts/RBNo3.1-Extrabold.otf') format('opentype');
  font-weight: 800;
  font-display: swap;
}
:root {
  /* Paleta oficial da marca (ver [Descritivo] N Chances.pdf) */
  --bg: #0c1712;
  --surface: #12201a;
  --card: #16251e;
  --accent: #A4C73E;
  --green: #3C9742;
  --yellow: #c99a3d;
  --info: #8fa5ad;
  --text: #eef1ec;
  --muted: #7f9086;
  --border: #223229;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 40px;
}
@media (min-width: 560px) { body { max-width: 560px; margin: 0 auto; } }
.header {
  background: var(--surface);
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.header-brand { display: flex; align-items: center; gap: 8px; }
.header-brand svg { width: 22px; height: auto; flex-shrink: 0; }
.header-brand .word { font-family: 'RBNo3.1', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--text); }
.header .subtitle { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.wrap { padding: 16px; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
}
.card a { text-decoration: none; color: inherit; display: block; }
.card-title { font-size: 1rem; font-weight: 700; }
.card-sub { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
.badge {
  font-size: 0.65rem; font-weight: 700; padding: 3px 9px;
  border-radius: 20px; text-transform: uppercase; letter-spacing: .5px;
  display: inline-block; margin-top: 8px;
}
.badge-aberto   { background: rgba(60,151,66,.18); color: var(--green); }
.badge-fechado  { background: rgba(201,154,61,.18); color: var(--yellow); }
.badge-sorteado { background: rgba(143,165,173,.18); color: var(--info); }
.loading { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 0.9rem; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.85rem; }
.section-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 20px 0 10px; }
.section-title:first-child { margin-top: 0; }
.jogo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.jogo-idx { font-size: 0.75rem; color: var(--muted); width: 26px; flex-shrink: 0; }
.bolas { display: flex; gap: 6px; flex-wrap: wrap; }
.bola {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem; font-weight: 800; flex-shrink: 0;
}
.bola.acerto { box-shadow: 0 0 0 3px var(--accent); }
.bola.grande { width: 40px; height: 40px; font-size: 0.85rem; }
.acertos-tag {
  font-size: 0.7rem; font-weight: 700; color: var(--muted);
  background: var(--surface); padding: 2px 8px; border-radius: 12px;
  margin-left: auto; border: 1px solid var(--border);
}
.acertos-tag.premiado {
  color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent);
  border: 1px solid var(--accent);
}
.resumo-linha {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem;
}
.resumo-linha:last-child { border-bottom: none; }
.resumo-linha.premiado { color: var(--accent); font-weight: 700; }
.tabela { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 6px; }
.tabela th, .tabela td { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--border); }
.tabela th { color: var(--muted); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; }
.footer {
  margin-top: 24px; padding: 14px 4px; font-size: 0.68rem; color: var(--muted);
  text-align: center; line-height: 1.5;
}
.back { display: inline-block; margin-bottom: 12px; color: var(--muted); text-decoration: none; font-size: 0.85rem; }
.cta-comprar {
  display: block; width: 100%; border: none; border-radius: 12px;
  padding: 16px 18px; margin-bottom: 16px; cursor: pointer;
  background: #25D366; color: #06381f; text-decoration: none;
  font-size: 1rem; font-weight: 800; text-align: center;
  box-shadow: 0 4px 14px rgba(37,211,102,.35);
}

/* Modal central do seletor de cotas — um único modal compartilhado pelos
   dois botões (início e fim da página), já que só um pode estar aberto por
   vez e o conteúdo é idêntico independente de qual botão abriu. */
.cta-overlay {
  position: fixed; inset: 0; background: rgba(2,4,3,.65);
  z-index: 100; opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.cta-overlay.aberto { opacity: 1; pointer-events: auto; }
.cta-modal {
  position: fixed; left: 20px; right: 20px; top: 50%; z-index: 101;
  max-width: 400px; margin: 0 auto;
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 22px 20px 20px;
  transform: translateY(-50%) scale(.92); opacity: 0; pointer-events: none;
  transition: transform .18s ease, opacity .18s ease;
}
.cta-modal.aberto { transform: translateY(-50%) scale(1); opacity: 1; pointer-events: auto; }
.cta-modal-fechar {
  position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%;
  border: none; background: var(--surface); color: var(--muted); font-size: 0.95rem; cursor: pointer;
}
.cta-modal-titulo { font-weight: 800; font-size: 0.95rem; text-align: center; margin-bottom: 4px; }
.cta-modal-sub { font-size: 0.72rem; color: var(--muted); text-align: center; margin-bottom: 16px; }
.cta-stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 16px; }
.cta-stepper button {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 1.25rem; font-weight: 800;
  cursor: pointer; line-height: 1;
}
.cta-stepper .cta-valor { font-size: 1.1rem; font-weight: 800; min-width: 92px; text-align: center; }
.cta-enviar {
  display: block; width: 100%; border: none; border-radius: 10px;
  padding: 13px; cursor: pointer; text-decoration: none;
  background: #25D366; color: #06381f; font-size: 0.88rem; font-weight: 800; text-align: center;
}
</style>
</head>

      <path fill="url(#ncLogoGrad)" d="M50.61,443.7H124.71c46.11,0,83.49-37.38,83.49-83.49v-41.73l-55.66-55.66v97.39c0,15.37-12.46,27.83-27.83,27.83H56.18V205.59c0-17.25,13.15-24.04,17.18-25.71,4.03-1.67,18.13-6.17,30.33,6.03l26.33,26.33v-.17l97.85,97.85v.18s47.9,47.89,47.9,47.89c8.24,8.24,18.81,13.14,29.86,14.37,9.69,1.08,19.74-.65,28.95-5.49,16.67-8.76,26.71-26.47,26.71-45.3V52.33c0-27.67-22.43-50.09-50.09-50.09h-75.16c-46.11,0-83.49,37.38-83.49,83.49v42.29l55.66,55.66V85.73c0-15.37,12.46-27.83,27.83-27.83h47.33c12.3,0,22.26,9.97,22.26,22.26v228.97l-76.64-76.64v.21s-88.94-88.95-88.94-88.95c-23.07-21.03-54.5-27.34-83.87-16.84-1.38,.49-2.76,.97-4.12,1.54C20.26,141.62,.52,171.18,.52,205.59v188.01c0,27.67,22.43,50.09,50.09,50.09Z"/>
    </svg>
    <span class="word">Chances</span>
  </div>
  <div class="subtitle" id="header-subtitle">Bolões</div>
</div>

<div class="wrap" id="app">
  <div class="loading"><div class="spinner"></div>Carregando...</div>
</div>

<script>
// ============================================================
// Cor oficial por loteria ("Paleta jogos" do Manual de Identidade Visual
// das Loterias CAIXA) — espelha worker/src/lib/loterias.js. Qualquer
// mudança de cor precisa ser replicada nos dois lugares (ver comentário lá).
// ============================================================
// Número da bolinha é sempre branco. Nas loterias de fundo claro (contraste
// ruim com branco puro) usa uma sombra escura suave em vez de contorno
// rígido ou texto preto — opção escolhida entre as 4 alternativas
// apresentadas em preview.
// `tema` é o fundo/superfície/cartão escurecidos a partir da cor oficial da
// loteria (aprovado em preview) — aplicado na página de detalhe via
// aplicarTemaLoteria(). "outro" mantém a paleta padrão da marca (:root).
const LOTERIAS = {
  'mega-sena':  { nome: 'Mega-Sena',  emoji: '🟢', cor: '#00AB67', sombra: true,
    tema: { bg: '#071410', surface: '#0d1f18', card: '#12291f', border: '#1c3a2c', muted: '#7fa693' } },
  'lotofacil':  { nome: 'Lotofácil',  emoji: '🟣', cor: '#803594',
    tema: { bg: '#130a17', surface: '#1d1122', card: '#27182d', border: '#3a2542', muted: '#a08aa8' } },
  'quina':      { nome: 'Quina',      emoji: '🔵', cor: '#005DA4',
    tema: { bg: '#050f19', surface: '#0a1928', card: '#0f2337', border: '#17324c', muted: '#7f9bb3' } },
  'lotomania':  { nome: 'Lotomania',  emoji: '🟠', cor: '#F99D1C', sombra: true,
    tema: { bg: '#180f06', surface: '#23180a', card: '#2e210e', border: '#453118', muted: '#b8a184' } },
  'dupla-sena': { nome: 'Dupla Sena', emoji: '🔴', cor: '#A62A52',
    tema: { bg: '#16070c', surface: '#200a12', card: '#2b0e18', border: '#401322', muted: '#ab8590' } },
  'timemania':  { nome: 'Timemania',  emoji: '🟡', cor: '#FFDD00', sombra: true,
    tema: { bg: '#14120a', surface: '#1e1a0f', card: '#28220e', border: '#3d331d', muted: '#b0a583' } },
  'outro':      { nome: 'Sorteio',    emoji: '⚪', cor: '#6B7280', tema: null },
};

// Aplica o tema de fundo/superfície/cartão/destaque da loteria na página de
// detalhe (a home fica sempre na paleta padrão, já que mistura várias
// loterias ao mesmo tempo).
function aplicarTemaLoteria(loteria) {
  const info = loteriaInfo(loteria);
  const raiz = document.documentElement.style;
  const t = info.tema;
  raiz.setProperty('--bg', t ? t.bg : '#0c1712');
  raiz.setProperty('--surface', t ? t.surface : '#12201a');
  raiz.setProperty('--card', t ? t.card : '#16251e');
  raiz.setProperty('--border', t ? t.border : '#223229');
  raiz.setProperty('--muted', t ? t.muted : '#7f9086');
  raiz.setProperty('--accent', t ? info.cor : '#A4C73E');
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', t ? t.surface : '#12201a');
}
const STATUS_LABEL = { ABERTO: 'Aberto', FECHADO: 'Fechado', SORTEADO: 'Sorteado' };
const STATUS_BADGE_CLASS = { ABERTO: 'badge-aberto', FECHADO: 'badge-fechado', SORTEADO: 'badge-sorteado' };
const TIPO_ESTRATEGIA_LABEL = { SIMPLES: 'Jogos avulsos', SURPRESINHA: 'Surpresinha', DESDOBRAMENTO: 'Desdobramento', FECHAMENTO: 'Fechamento' };
const TIPO_SORTEIO_LABEL = {
  acumulado: 'ACUMULADA', simples: 'SIMPLES', surpresinha: 'SURPRESINHA',
  teimosinha: 'TEIMOSINHA', especial: 'ESPECIAL',
};

function loteriaInfo(loteria) { return LOTERIAS[loteria] || LOTERIAS['outro']; }

// Nº mínimo de acertos que já paga algum prêmio em dinheiro, por loteria —
// regras gerais conhecidas da Caixa (não vêm de API oficial, então podem
// ficar desatualizadas se a Caixa mudar as faixas — confira contra o
// resultado oficial do concurso antes de confiar cegamente). Lotomania é
// especial: também paga com ZERO acertos, além de 15+.
const FAIXA_PREMIADA = {
  'mega-sena':  { minimo: 4 },  // quadra, quina, sena
  'lotofacil':  { minimo: 11 }, // 11 a 15 acertos
  'quina':      { minimo: 3 },  // terno, quadra, quina
  'lotomania':  { minimo: 15, tambemZero: true },
  'dupla-sena': { minimo: 4 },  // por sorteio (1º ou 2º), quadra/quina/sena
  'timemania':  { minimo: 3 },  // não considera o "time do coração" (não modelado aqui)
  'outro':      null,
};
function ehFaixaPremiada(loteria, acertos) {
  const regra = FAIXA_PREMIADA[loteria];
  if (!regra) return false;
  if (regra.tambemZero && acertos === 0) return true;
  return acertos >= regra.minimo;
}

// Título do card: bolinha da loteria + nome + tipo (ou nome próprio, em
// sorteios especiais, ex. "LOTOFÁCIL DA INDEPENDÊNCIA").
function tituloPublico(b) {
  const info = loteriaInfo(b.loteria);
  const tipoLabel = (b.tipo_sorteio === 'especial' && b.nome) ? escapeHtml(b.nome.toUpperCase()) : (TIPO_SORTEIO_LABEL[b.tipo_sorteio] || '');
  return `${info.emoji} ${[info.nome.toUpperCase(), tipoLabel].filter(Boolean).join(' ')}`;
}
function fmtData(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.slice(0, 10).split('-');
  return `${d}/${m}/${y}`;
}
function fmtMoeda(v) {
  if (v == null) return '—';
  return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function bolaHtml(numero, loteria, acertou, grande) {
  const info = loteriaInfo(loteria);
  const classes = ['bola', acertou ? 'acerto' : '', grande ? 'grande' : ''].filter(Boolean).join(' ');
  const sombra = info.sombra ? ';text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6)' : '';
  return `<div class="${classes}" style="background:${info.cor};color:#fff${sombra}">${String(numero).padStart(2, '0')}</div>`;
}

async function apiGet(path) {
  const res = await fetch(path);
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.statusText); }
  return res.json();
}

// ============================================================
// CTA DE COMPRA — botão abre um modal central com um seletor de cotas
// (0,5 em 0,5) antes de montar a mensagem do WhatsApp. Início e fim da
// página usam o MESMO botão/modal (só um pode estar aberto por vez, e o
// conteúdo é idêntico não importa qual dos dois abriu).
// ============================================================
let bolaoAtual = null;
let ctaQtd = 1;

function renderCtaBotao() {
  return `<button type="button" class="cta-comprar" onclick="abrirModalCota()">🛒 Quero comprar uma cota!</button>`;
}

// Modal fica fora do fluxo normal da página (fixed, sobre tudo) — um bloco
// só, inserido uma vez no fim do HTML montado por carregarDetalhe().
function renderCtaModal() {
  return `
  <div class="cta-overlay" id="cta-overlay" onclick="fecharModalCota()"></div>
  <div class="cta-modal" id="cta-modal">
    <button type="button" class="cta-modal-fechar" onclick="fecharModalCota()">✕</button>
    <div class="cta-modal-titulo">Escolha a quantidade</div>
    <div class="cta-modal-sub" id="cta-modal-sub"></div>
    <div class="cta-stepper">
      <button type="button" onclick="alterarCota(-0.5)">−</button>
      <span class="cta-valor" id="cta-valor">1 cota</span>
      <button type="button" onclick="alterarCota(0.5)">+</button>
    </div>
    <a class="cta-enviar" id="cta-enviar" target="_blank" rel="noopener">📲 Enviar mensagem</a>
  </div>`;
}

function formatarCotas(qtd) {
  const texto = qtd.toFixed(1).replace('.0', '').replace('.', ',');
  return `${texto} cota${qtd === 1 ? '' : 's'}`;
}

function abrirModalCota() {
  ctaQtd = 1;
  document.getElementById('cta-valor').textContent = formatarCotas(ctaQtd);
  document.getElementById('cta-modal-sub').textContent = `de cotas do bolão ${bolaoAtual.codigo}`;
  document.getElementById('cta-overlay').classList.add('aberto');
  document.getElementById('cta-modal').classList.add('aberto');
  atualizarLinkCta();
}

function fecharModalCota() {
  document.getElementById('cta-overlay').classList.remove('aberto');
  document.getElementById('cta-modal').classList.remove('aberto');
}

function alterarCota(delta) {
  const max = bolaoAtual?.quantidade_cotas || 20;
  ctaQtd = Math.min(max, Math.max(0.5, ctaQtd + delta));
  document.getElementById('cta-valor').textContent = formatarCotas(ctaQtd);
  atualizarLinkCta();
}

function atualizarLinkCta() {
  if (!bolaoAtual) return;
  const info = loteriaInfo(bolaoAtual.loteria);
  const msg = encodeURIComponent(
    `Olá! Quero adquirir ${formatarCotas(ctaQtd)} do bolão abaixo:\n\n*${bolaoAtual.codigo}*\nLoteria: ${info.nome.toUpperCase()}\nPrêmio: ${bolaoAtual.premio_estimado || '—'}\nConcurso: ${bolaoAtual.concurso ?? ''};\n\n${location.href}`
  );
  document.getElementById('cta-enviar').href = `https://wa.me/5584999824799?text=${msg}`;
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') fecharModalCota();
});

// ============================================================
// HOME (/jogos_e_resultado/) — lista de bolões ativos (UC11)
// ============================================================
async function carregarHome() {
  document.getElementById('header-subtitle').textContent = 'Bolões em andamento';
  const app = document.getElementById('app');
  try {
    const { boloes } = await apiGet('/api/public/boloes');
    if (!boloes.length) {
      app.innerHTML = '<div class="empty">Nenhum bolão em andamento no momento.</div>';
      return;
    }
    app.innerHTML = boloes.map(b => {
      const premio = b.premio_estimado ? ` ${escapeHtml(b.premio_estimado)}` : '';
      const info = loteriaInfo(b.loteria);
      const t = info.tema;
      const estiloCard = t ? `background:${t.card};border-color:${t.border}` : '';
      return `
      <div class="card" style="${estiloCard}">
        <a href="/jogos_e_resultado/${encodeURIComponent(b.codigo)}">
          <div class="card-title">${tituloPublico(b)}${premio}</div>
          <div class="card-sub" style="${t ? `color:${t.muted}` : ''}">${escapeHtml(b.codigo)} • Sorteio: ${fmtData(b.data_sorteio)} • ${b.quantidade_cotas ?? '—'} cotas • Concurso #${b.concurso ?? '—'}</div>
          <span class="badge ${STATUS_BADGE_CLASS[b.status] || ''}">${STATUS_LABEL[b.status] || b.status}</span>
        </a>
      </div>`;
    }).join('');
  } catch (err) {
    app.innerHTML = `<div class="empty">Erro ao carregar bolões: ${escapeHtml(err.message)}</div>`;
  }
}

// ============================================================
// DETALHE (/jogos_e_resultado/:codigo) — jogos, estratégia, resultado (UC08-UC10)
// ============================================================
async function carregarDetalhe(codigo) {
  document.getElementById('header-subtitle').textContent = codigo;
  const app = document.getElementById('app');
  try {
    const { bolao, estrategia, jogos, resultado } = await apiGet('/api/public/boloes/' + encodeURIComponent(codigo));
    aplicarTemaLoteria(bolao.loteria);
    const back = '<a href="/jogos_e_resultado/" class="back">&larr; Todos os bolões</a>';

    // CTA de compra (início e fim da página): clicar no botão abre um modal
    // central com o seletor de cotas (0,5 em 0,5) antes de montar a
    // mensagem do WhatsApp — mesmo botão/modal nas duas posições.
    bolaoAtual = bolao;
    ctaQtd = 1;
    const htmlCtaTop = bolao.status === 'ABERTO' ? renderCtaBotao() : '';
    const htmlCtaBottom = bolao.status === 'ABERTO' ? renderCtaBotao() : '';
    const htmlCtaModal = bolao.status === 'ABERTO' ? renderCtaModal() : '';

    const premio = bolao.premio_estimado ? ` ${escapeHtml(bolao.premio_estimado)}` : '';
    const htmlHeader = `
    <div class="card">
      <div class="card-title">${tituloPublico(bolao)}${premio}</div>
      <div class="card-sub">${escapeHtml(bolao.codigo)} • Sorteio: ${fmtData(bolao.data_sorteio)} • ${bolao.quantidade_cotas ?? '—'} cotas • Concurso #${bolao.concurso ?? '—'}</div>
      <span class="badge ${STATUS_BADGE_CLASS[bolao.status] || ''}">${STATUS_LABEL[bolao.status] || bolao.status}</span>
    </div>`;

    let htmlResultado = '';
    if (resultado) {
      htmlResultado = '<div class="section-title">Resultado do sorteio</div><div class="card">';
      htmlResultado += `<div style="font-size:.75rem;color:var(--muted);margin-bottom:6px">Dezenas sorteadas${resultado.data_apuracao ? ' • ' + fmtData(resultado.data_apuracao) : ''}:</div>`;
      const dezenasSorteadasOrdenadas = resultado.dezenas_sorteadas.slice().sort((a, b) => a - b);
      htmlResultado += `<div class="bolas">${dezenasSorteadasOrdenadas.map(d => bolaHtml(d, bolao.loteria, true, true)).join('')}</div>`;
      if (resultado.premiacoes && resultado.premiacoes.length) {
        htmlResultado += `<table class="tabela"><thead><tr><th>Faixa</th><th>Acertos</th><th>Ganhadores</th><th>Rateio</th></tr></thead><tbody>`;
        htmlResultado += resultado.premiacoes.map(p => `<tr>
          <td>${escapeHtml(p.faixa || '—')}</td>
          <td>${p.acertos_necessarios ?? '—'}</td>
          <td>${p.ganhadores ?? '—'}</td>
          <td>${p.valor_rateio_centavos != null ? fmtMoeda(p.valor_rateio_centavos / 100) : '—'}</td>
        </tr>`).join('');
        htmlResultado += '</tbody></table>';
      }
      htmlResultado += '</div>';
    }

    let htmlEstrategia = '';
    if (estrategia) {
      htmlEstrategia = `<div class="section-title">Estratégia</div><div class="card">
        <div style="font-weight:700;margin-bottom:6px">${TIPO_ESTRATEGIA_LABEL[estrategia.tipo] || estrategia.tipo}</div>
        ${estrategia.dezenas_base && estrategia.dezenas_base.length ? `
          <div style="font-size:.75rem;color:var(--muted);margin-bottom:6px">Dezenas base:</div>
          <div class="bolas">${estrategia.dezenas_base.map(d => bolaHtml(d, bolao.loteria, false)).join('')}</div>
        ` : ''}
        ${estrategia.descricao ? `<div style="font-size:.82rem;margin-top:10px;color:var(--muted)">${escapeHtml(estrategia.descricao)}</div>` : ''}
        ${(() => {
          const partes = [];
          if (estrategia.comprovante_numero) partes.push(`Comprovante nº <b style="color:var(--text)">${escapeHtml(estrategia.comprovante_numero)}</b>`);
          if (estrategia.comprovante_data) partes.push(`Realizado em <b style="color:var(--text)">${fmtData(estrategia.comprovante_data)}</b>`);
          if (estrategia.comprovante_horario) partes.push(`às <b style="color:var(--text)">${escapeHtml(estrategia.comprovante_horario)}</b>`);
          return partes.length
            ? `<div style="font-size:.72rem;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">${partes.join(' · ')}</div>`
            : '';
        })()}
      </div>`;
    }

    let htmlJogos = '<div class="section-title">Jogos</div>';
    const contagemAcertos = {}; // nº de acertos -> quantidade de jogos
    if (!jogos.length) {
      htmlJogos += '<div class="empty">Jogos ainda não divulgados para este bolão.</div>';
    } else {
      htmlJogos += '<div class="card">' + jogos.map((j, i) => {
        const sorteadas = resultado ? new Set(resultado.dezenas_sorteadas) : null;
        const dezenasOrdenadas = j.dezenas.slice().sort((a, b) => a - b);
        const bolasHtml = dezenasOrdenadas.map(d => bolaHtml(d, bolao.loteria, sorteadas ? sorteadas.has(d) : false)).join('');
        let tagAcertos = '';
        if (resultado) {
          contagemAcertos[j.acertos] = (contagemAcertos[j.acertos] || 0) + 1;
          const premiado = ehFaixaPremiada(bolao.loteria, j.acertos);
          tagAcertos = `<span class="acertos-tag${premiado ? ' premiado' : ''}">${premiado ? '💰 ' : ''}${j.acertos} acerto${j.acertos === 1 ? '' : 's'}</span>`;
        }
        return `<div class="jogo-row"><div class="jogo-idx">#${i + 1}</div><div class="bolas">${bolasHtml}</div>${tagAcertos}</div>`;
      }).join('') + '</div>';
    }

    let htmlResumo = '';
    if (resultado && jogos.length) {
      const contagens = Object.keys(contagemAcertos).map(Number).sort((a, b) => b - a);
      htmlResumo = '<div class="section-title">Resumo de acertos</div><div class="card">';
      htmlResumo += contagens.map(acertos => {
        const qtd = contagemAcertos[acertos];
        const premiado = ehFaixaPremiada(bolao.loteria, acertos);
        return `<div class="resumo-linha${premiado ? ' premiado' : ''}">
          <span>${premiado ? '💰 ' : ''}${acertos} acerto${acertos === 1 ? '' : 's'}</span>
          <span>${qtd} jogo${qtd === 1 ? '' : 's'}</span>
        </div>`;
      }).join('');
      htmlResumo += '</div>';
    }

    let html = back + htmlCtaTop + htmlHeader + htmlResultado + htmlEstrategia + htmlJogos + htmlResumo + htmlCtaBottom + htmlCtaModal;

    html += `<div class="footer">Conteúdo informativo do bolão N-Chances. Nenhum dado pessoal de participantes é exibido nesta página.</div>`;

    app.innerHTML = html;
  } catch (err) {
    app.innerHTML = `<a href="/jogos_e_resultado/" class="back">&larr; Todos os bolões</a><div class="empty">Bolão não encontrado ou erro ao carregar: ${escapeHtml(err.message)}</div>`;
  }
}

// ============================================================
// ROTEAMENTO (client-side, dentro do mesmo bundle estático)
// ============================================================
(function init() {
  const codigo = decodeURIComponent(location.pathname.replace(/^\/jogos_e_resultado\/?/, '').replace(/\/$/, ''));
  if (codigo) carregarDetalhe(codigo);
  else carregarHome();
})();
</script>
</body>
</html>
