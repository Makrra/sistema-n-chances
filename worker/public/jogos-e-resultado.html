<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0c1712">
<title>N-Chances | Bolões</title>
<style>
/* Tipografia oficial da marca (ver [Descritivo] N Chances.pdf) — usada só no
   wordmark "Chances" do cabeçalho. Caminho absoluto porque esta página é
   servida em /jogos_e_resultado/ e /jogos_e_resultado/{codigo} (relativo quebraria sob /jogos_e_resultado/{codigo}). */
@font-face {
  font-family: 'RBNo3.1';
  src: url('/fonts/RBNo3.1-Extrabold.otf') format('opentype');
  font-weight: 800;
  font-display: swap;
}
:root {
  /* Paleta oficial da marca (ver [Descritivo] N Chances.pdf) */
  --bg: #0c1712;
  --surface: #12201a;
  --card: #16251e;
  --accent: #A4C73E;
  --green: #3C9742;
  --yellow: #c99a3d;
  --info: #8fa5ad;
  --text: #eef1ec;
  --muted: #7f9086;
  --border: #223229;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 40px;
}
@media (min-width: 560px) { body { max-width: 560px; margin: 0 auto; } }
.header {
  background: var(--surface);
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.header-brand { display: flex; align-items: center; gap: 8px; }
.header-brand svg { width: 22px; height: auto; flex-shrink: 0; }
.header-brand .word { font-family: 'RBNo3.1', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--text); }
.header .subtitle { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.wrap { padding: 16px; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
}
.card a { text-decoration: none; color: inherit; display: block; }
.card-title { font-size: 1rem; font-weight: 700; }
.card-sub { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
.badge {
  font-size: 0.65rem; font-weight: 700; padding: 3px 9px;
  border-radius: 20px; text-transform: uppercase; letter-spacing: .5px;
  display: inline-block; margin-top: 8px;
}
.badge-aberto   { background: rgba(60,151,66,.18); color: var(--green); }
.badge-fechado  { background: rgba(201,154,61,.18); color: var(--yellow); }
.badge-sorteado { background: rgba(143,165,173,.18); color: var(--info); }
.loading { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 0.9rem; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.85rem; }
.section-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 20px 0 10px; }
.section-title:first-child { margin-top: 0; }
.jogo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.jogo-idx { font-size: 0.75rem; color: var(--muted); width: 26px; flex-shrink: 0; }
.bolas { display: flex; gap: 6px; flex-wrap: wrap; }
.bola {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem; font-weight: 800; flex-shrink: 0;
}
.bola.acerto { box-shadow: 0 0 0 3px var(--accent); }
.bola.grande { width: 40px; height: 40px; font-size: 0.85rem; }
.acertos-tag {
  font-size: 0.7rem; font-weight: 700; color: var(--accent);
  background: rgba(164,199,62,.12); padding: 2px 8px; border-radius: 12px;
  margin-left: auto;
}
.tabela { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 6px; }
.tabela th, .tabela td { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--border); }
.tabela th { color: var(--muted); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; }
.footer {
  margin-top: 24px; padding: 14px 4px; font-size: 0.68rem; color: var(--muted);
  text-align: center; line-height: 1.5;
}
.back { display: inline-block; margin-bottom: 12px; color: var(--muted); text-decoration: none; font-size: 0.85rem; }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <svg viewBox="-10 -10 350 466" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="ncLogoGrad" x1="5602.47" y1="718.3" x2="5389.84" y2="414.63" gradientTransform="translate(5689.14 806.69) rotate(-180)" gradientUnits="userSpaceOnUse">
          <stop offset=".4" stop-color="#a4c73e"/>
          <stop offset=".71" stop-color="#3c9742"/>
          <stop offset="1" stop-color="#016331"/>
        </linearGradient>
      </defs>
      <path fill="url(#ncLogoGrad)" d="M50.61,443.7H124.71c46.11,0,83.49-37.38,83.49-83.49v-41.73l-55.66-55.66v97.39c0,15.37-12.46,27.83-27.83,27.83H56.18V205.59c0-17.25,13.15-24.04,17.18-25.71,4.03-1.67,18.13-6.17,30.33,6.03l26.33,26.33v-.17l97.85,97.85v.18s47.9,47.89,47.9,47.89c8.24,8.24,18.81,13.14,29.86,14.37,9.69,1.08,19.74-.65,28.95-5.49,16.67-8.76,26.71-26.47,26.71-45.3V52.33c0-27.67-22.43-50.09-50.09-50.09h-75.16c-46.11,0-83.49,37.38-83.49,83.49v42.29l55.66,55.66V85.73c0-15.37,12.46-27.83,27.83-27.83h47.33c12.3,0,22.26,9.97,22.26,22.26v228.97l-76.64-76.64v.21s-88.94-88.95-88.94-88.95c-23.07-21.03-54.5-27.34-83.87-16.84-1.38,.49-2.76,.97-4.12,1.54C20.26,141.62,.52,171.18,.52,205.59v188.01c0,27.67,22.43,50.09,50.09,50.09Z"/>
    </svg>
    <span class="word">Chances</span>
  </div>
  <div class="subtitle" id="header-subtitle">Bolões</div>
</div>

<div class="wrap" id="app">
  <div class="loading"><div class="spinner"></div>Carregando...</div>
</div>

<script>
// ============================================================
// Cor oficial por loteria ("Paleta jogos" do Manual de Identidade Visual
// das Loterias CAIXA) — espelha worker/src/lib/loterias.js. Qualquer
// mudança de cor precisa ser replicada nos dois lugares (ver comentário lá).
// ============================================================
const LOTERIAS = {
  'mega-sena':  { nome: 'Mega-Sena',  emoji: '🟢', cor: '#00AB67', corTexto: '#000000' },
  'lotofacil':  { nome: 'Lotofácil',  emoji: '🟣', cor: '#803594', corTexto: '#FFFFFF' },
  'quina':      { nome: 'Quina',      emoji: '🔵', cor: '#005DA4', corTexto: '#FFFFFF' },
  'lotomania':  { nome: 'Lotomania',  emoji: '🟠', cor: '#F99D1C', corTexto: '#000000' },
  'dupla-sena': { nome: 'Dupla Sena', emoji: '🔴', cor: '#A62A52', corTexto: '#FFFFFF' },
  'timemania':  { nome: 'Timemania',  emoji: '🟡', cor: '#FFDD00', corTexto: '#000000' },
  'outro':      { nome: 'Sorteio',    emoji: '⚪', cor: '#6B7280', corTexto: '#FFFFFF' },
};
const STATUS_LABEL = { ABERTO: 'Aberto', FECHADO: 'Fechado', SORTEADO: 'Sorteado' };
const STATUS_BADGE_CLASS = { ABERTO: 'badge-aberto', FECHADO: 'badge-fechado', SORTEADO: 'badge-sorteado' };
const TIPO_ESTRATEGIA_LABEL = { SIMPLES: 'Jogos avulsos', SURPRESINHA: 'Surpresinha', DESDOBRAMENTO: 'Desdobramento', FECHAMENTO: 'Fechamento' };
const TIPO_SORTEIO_LABEL = {
  acumulado: 'ACUMULADA', simples: 'SIMPLES', surpresinha: 'SURPRESINHA',
  teimosinha: 'TEIMOSINHA', especial: 'ESPECIAL',
};

function loteriaInfo(loteria) { return LOTERIAS[loteria] || LOTERIAS['outro']; }

// Título do card: bolinha da loteria + nome + tipo (ou nome próprio, em
// sorteios especiais, ex. "LOTOFÁCIL DA INDEPENDÊNCIA").
function tituloPublico(b) {
  const info = loteriaInfo(b.loteria);
  const tipoLabel = (b.tipo_sorteio === 'especial' && b.nome) ? escapeHtml(b.nome.toUpperCase()) : (TIPO_SORTEIO_LABEL[b.tipo_sorteio] || '');
  return `${info.emoji} ${[info.nome.toUpperCase(), tipoLabel].filter(Boolean).join(' ')}`;
}
function fmtData(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.slice(0, 10).split('-');
  return `${d}/${m}/${y}`;
}
function fmtMoeda(v) {
  if (v == null) return '—';
  return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function bolaHtml(numero, loteria, acertou, grande) {
  const info = loteriaInfo(loteria);
  const classes = ['bola', acertou ? 'acerto' : '', grande ? 'grande' : ''].filter(Boolean).join(' ');
  return `<div class="${classes}" style="background:${info.cor};color:${info.corTexto}">${String(numero).padStart(2, '0')}</div>`;
}

async function apiGet(path) {
  const res = await fetch(path);
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.statusText); }
  return res.json();
}

// ============================================================
// HOME (/jogos_e_resultado/) — lista de bolões ativos (UC11)
// ============================================================
async function carregarHome() {
  document.getElementById('header-subtitle').textContent = 'Bolões em andamento';
  const app = document.getElementById('app');
  try {
    const { boloes } = await apiGet('/api/public/boloes');
    if (!boloes.length) {
      app.innerHTML = '<div class="empty">Nenhum bolão em andamento no momento.</div>';
      return;
    }
    app.innerHTML = boloes.map(b => {
      const premio = b.premio_estimado ? ` — ${escapeHtml(b.premio_estimado)}` : '';
      return `
      <div class="card">
        <a href="/jogos_e_resultado/${encodeURIComponent(b.codigo)}">
          <div class="card-title">${tituloPublico(b)}${premio}</div>
          <div class="card-sub">${escapeHtml(b.codigo)} • Sorteio: ${fmtData(b.data_sorteio)} • ${b.quantidade_cotas ?? '—'} cotas • Concurso #${b.concurso ?? '—'}</div>
          <span class="badge ${STATUS_BADGE_CLASS[b.status] || ''}">${STATUS_LABEL[b.status] || b.status}</span>
        </a>
      </div>`;
    }).join('');
  } catch (err) {
    app.innerHTML = `<div class="empty">Erro ao carregar bolões: ${escapeHtml(err.message)}</div>`;
  }
}

// ============================================================
// DETALHE (/jogos_e_resultado/:codigo) — jogos, estratégia, resultado (UC08-UC10)
// ============================================================
async function carregarDetalhe(codigo) {
  document.getElementById('header-subtitle').textContent = codigo;
  const app = document.getElementById('app');
  try {
    const { bolao, estrategia, jogos, resultado } = await apiGet('/api/public/boloes/' + encodeURIComponent(codigo));
    const info = loteriaInfo(bolao.loteria);
    let html = '<a href="/jogos_e_resultado/" class="back">&larr; Todos os bolões</a>';

    const premio = bolao.premio_estimado ? ` — ${escapeHtml(bolao.premio_estimado)}` : '';
    html += `
    <div class="card">
      <div class="card-title">${tituloPublico(bolao)}${premio}</div>
      <div class="card-sub">${escapeHtml(bolao.codigo)} • Sorteio: ${fmtData(bolao.data_sorteio)} • ${bolao.quantidade_cotas ?? '—'} cotas • Concurso #${bolao.concurso ?? '—'}</div>
      <span class="badge ${STATUS_BADGE_CLASS[bolao.status] || ''}">${STATUS_LABEL[bolao.status] || bolao.status}</span>
    </div>`;

    if (estrategia) {
      html += `<div class="section-title">Estratégia</div><div class="card">
        <div style="font-weight:700;margin-bottom:6px">${TIPO_ESTRATEGIA_LABEL[estrategia.tipo] || estrategia.tipo}</div>
        ${estrategia.dezenas_base && estrategia.dezenas_base.length ? `
          <div style="font-size:.75rem;color:var(--muted);margin-bottom:6px">Dezenas base:</div>
          <div class="bolas">${estrategia.dezenas_base.map(d => bolaHtml(d, bolao.loteria, false)).join('')}</div>
        ` : ''}
        ${estrategia.descricao ? `<div style="font-size:.82rem;margin-top:10px;color:var(--muted)">${escapeHtml(estrategia.descricao)}</div>` : ''}
      </div>`;
    }

    html += '<div class="section-title">Jogos</div>';
    if (!jogos.length) {
      html += '<div class="empty">Jogos ainda não divulgados para este bolão.</div>';
    } else {
      html += '<div class="card">' + jogos.map((j, i) => {
        const sorteadas = resultado ? new Set(resultado.dezenas_sorteadas) : null;
        const dezenasOrdenadas = j.dezenas.slice().sort((a, b) => a - b);
        const bolasHtml = dezenasOrdenadas.map(d => bolaHtml(d, bolao.loteria, sorteadas ? sorteadas.has(d) : false)).join('');
        const tagAcertos = resultado ? `<span class="acertos-tag">${j.acertos} acerto${j.acertos === 1 ? '' : 's'}</span>` : '';
        return `<div class="jogo-row"><div class="jogo-idx">#${i + 1}</div><div class="bolas">${bolasHtml}</div>${tagAcertos}</div>`;
      }).join('') + '</div>';
    }

    if (resultado) {
      html += '<div class="section-title">Resultado do sorteio</div><div class="card">';
      html += `<div style="font-size:.75rem;color:var(--muted);margin-bottom:6px">Dezenas sorteadas${resultado.data_apuracao ? ' • ' + fmtData(resultado.data_apuracao) : ''}:</div>`;
      const dezenasSorteadasOrdenadas = resultado.dezenas_sorteadas.slice().sort((a, b) => a - b);
      html += `<div class="bolas">${dezenasSorteadasOrdenadas.map(d => bolaHtml(d, bolao.loteria, true, true)).join('')}</div>`;
      if (resultado.premiacoes && resultado.premiacoes.length) {
        html += `<table class="tabela"><thead><tr><th>Faixa</th><th>Acertos</th><th>Ganhadores</th><th>Rateio</th></tr></thead><tbody>`;
        html += resultado.premiacoes.map(p => `<tr>
          <td>${escapeHtml(p.faixa || '—')}</td>
          <td>${p.acertos_necessarios ?? '—'}</td>
          <td>${p.ganhadores ?? '—'}</td>
          <td>${p.valor_rateio_centavos != null ? fmtMoeda(p.valor_rateio_centavos / 100) : '—'}</td>
        </tr>`).join('');
        html += '</tbody></table>';
      }
      html += '</div>';
    }

    html += `<div class="footer">Conteúdo informativo do bolão N-Chances. Nenhum dado pessoal de participantes é exibido nesta página.</div>`;

    app.innerHTML = html;
  } catch (err) {
    app.innerHTML = `<a href="/jogos_e_resultado/" class="back">&larr; Todos os bolões</a><div class="empty">Bolão não encontrado ou erro ao carregar: ${escapeHtml(err.message)}</div>`;
  }
}

// ============================================================
// ROTEAMENTO (client-side, dentro do mesmo bundle estático)
// ============================================================
(function init() {
  const codigo = decodeURIComponent(location.pathname.replace(/^\/jogos_e_resultado\/?/, '').replace(/\/$/, ''));
  if (codigo) carregarDetalhe(codigo);
  else carregarHome();
})();
</script>
</body>
</html>
