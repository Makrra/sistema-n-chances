name = "n-chances"
main = "src/index.js"
compatibility_date = "2026-07-26"

# ============================================================
# Default (sem --env): usado só para dev local (wrangler dev --local).
# database_id é um placeholder — dev local não toca a conta real.
# ============================================================
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/jogos_e_resultado/*"]
# "none" evita o redirect automático que o handling padrão de assets faz de
# /arquivo.html -> /arquivo (isso quebrava /jogos_e_resultado/{codigo}, que
# sempre voltava pra /jogos_e_resultado sem o código — ver o fetch manual de
# jogos-e-resultado.html em src/index.js).
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "n-chances-db"
database_id = "00000000-0000-0000-0000-000000000000"

# ============================================================
# Staging: wrangler deploy --env staging
# Worker fica em "n-chances-staging" (nome derivado automaticamente).
# ============================================================
[env.staging.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/jogos_e_resultado/*"]
html_handling = "none"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "n-chances-db-staging"
database_id = "8580e3e7-9cbf-47d1-8389-893a485e97e2"

# custom_domain = true faz o wrangler provisionar e gerenciar o registro DNS
# e o certificado automaticamente no deploy (exige a zona nchances.com.br
# ativa na Cloudflare primeiro).
[[env.staging.routes]]
pattern = "staging.nchances.com.br"
custom_domain = true

# ============================================================
# Produção: wrangler deploy --env production
# Worker fica em "n-chances-production" (nome derivado automaticamente).
# workers_dev = true expõe também https://n-chances-production.nchancees.workers.dev
# — usado como acesso alternativo quando nchances.com.br é bloqueado por
# ferramentas de rede corporativa que classificam domínios recém-registrados
# (workers.dev já existe há anos, não cai nessa categoria).
# ============================================================
[env.production]
workers_dev = true

[env.production.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/jogos_e_resultado/*"]
html_handling = "none"

[[env.production.d1_databases]]
binding = "DB"
database_name = "n-chances-db-prod"
database_id = "e89f109f-b65b-4cf7-a8c8-d84cd4e92bd5"

[[env.production.routes]]
pattern = "nchances.com.br"
custom_domain = true

[[env.production.routes]]
pattern = "www.nchances.com.br"
custom_domain = true
