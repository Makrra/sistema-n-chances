name: Verificar loterias acumuladas

on:
  schedule:
    # 09:37 UTC = 06:37 em Brasília. Minuto "quebrado" e disparo com folga
    # antes das 8h: o cron do GitHub Actions não é pontual em horários cheios
    # (ex: 11:00 UTC), que ficam sobrecarregados e podem atrasar horas.
    - cron: '37 9 * * *'
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar verificação e enviar e-mail
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: avisos@nchances.com.br
          EMAIL_DESTINOS: neydson_daniel@hotmail.com,neydson@petrobras.com.br
        run: node scripts/verificar-acumulados.mjs
