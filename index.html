<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="N-Chances">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>N-Chances | Bolões</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --card: #16213e;
  --accent: #e94560;
  --accent2: #0f3460;
  --green: #00b894;
  --yellow: #fdcb6e;
  --red: #d63031;
  --text: #e2e2e2;
  --muted: #8892a4;
  --border: #2a2a45;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
}
/* HEADER */
.header {
  background: var(--surface);
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.header h1 { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
.header .subtitle { font-size: 0.75rem; color: var(--muted); }
/* NAV */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex; z-index: 100;
}
.nav-btn {
  flex: 1; padding: 10px 4px; border: none; background: none;
  color: var(--muted); font-size: 0.65rem; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: color .2s;
}
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 22px; height: 22px; }
/* PAGES */
.page { display: none; padding: 16px; }
.page.active { display: block; }
/* CARDS */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
}
.card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 10px;
}
.card-title { font-size: 0.95rem; font-weight: 600; }
.card-sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
/* BADGES */
.badge {
  font-size: 0.65rem; font-weight: 700; padding: 3px 8px;
  border-radius: 20px; text-transform: uppercase; letter-spacing: .5px;
}
.badge-green  { background: rgba(0,184,148,.15); color: var(--green); }
.badge-yellow { background: rgba(253,203,110,.15); color: var(--yellow); }
.badge-red    { background: rgba(214,48,49,.15); color: var(--red); }
.badge-blue   { background: rgba(15,52,96,.5); color: #74b9ff; }
/* STATS ROW */
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 10px; text-align: center;
}
.stat-val { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
.stat-lbl { font-size: 0.65rem; color: var(--muted); margin-top: 3px; }
/* BUTTONS */
.btn {
  border: none; border-radius: 8px; padding: 10px 18px;
  font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: opacity .2s;
}
.btn:hover { opacity: .85; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-success { background: var(--green); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 0.75rem; }
.btn-block { width: 100%; }
/* FAB */
.fab {
  position: fixed; bottom: 90px; right: 20px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 1.6rem; cursor: pointer; box-shadow: 0 4px 20px rgba(233,69,96,.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 99;
}
/* FORM */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; display: block; }
.form-control {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; color: var(--text);
  font-size: 0.9rem; transition: border-color .2s;
}
.form-control:focus { outline: none; border-color: var(--accent); }
select.form-control option { background: var(--bg); }
/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.7); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 24px 20px 32px; width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto;
}
.modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
/* LIST ITEMS */
.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.list-item:last-child { border-bottom: none; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent2); display: flex; align-items: center;
  justify-content: center; font-weight: 700; font-size: 0.9rem;
  color: #74b9ff; flex-shrink: 0;
}
.item-info { flex: 1; min-width: 0; }
.item-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-detail { font-size: 0.75rem; color: var(--muted); }
.item-value { font-size: 0.95rem; font-weight: 700; }
.text-green { color: var(--green); }
.text-red   { color: var(--red); }
.text-yellow{ color: var(--yellow); }
/* SEARCH */
.search-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 0 12px; margin-bottom: 14px;
}
.search-box input {
  flex: 1; background: none; border: none; color: var(--text);
  font-size: 0.9rem; padding: 10px 0; outline: none;
}
/* PICKER DE CLIENTE (busca) */
.picker-list {
  max-height: 200px; overflow-y: auto; margin-top: 8px;
  border: 1px solid var(--border); border-radius: 8px; padding: 0 10px;
}
.picker-list .list-item { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: rgba(233,69,96,.2); }
.picker-list .list-item.selected { background: rgba(233,69,96,.12); border-radius: 8px; }
.picker-empty { padding: 12px 0; color: var(--muted); font-size: 0.8rem; text-align: center; }
/* TABS */
.tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
.tab-btn {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border); background: none; color: var(--muted);
  font-size: 0.8rem; cursor: pointer; transition: all .2s;
}
.tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
/* TOAST */
.toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: var(--green); color: #fff; padding: 10px 20px;
  border-radius: 20px; font-size: 0.85rem; font-weight: 600;
  opacity: 0; transition: all .3s; z-index: 300; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--red); }
/* LOADING */
.loading { text-align: center; padding: 40px; color: var(--muted); font-size: 0.9rem; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
/* SALDO CARD */
.saldo-positive { color: var(--green); font-weight: 800; font-size: 1.1rem; }
.saldo-negative { color: var(--red); font-weight: 800; font-size: 1.1rem; }
/* EXTRATO ICON */
.ext-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
.ext-credito { background: rgba(0,184,148,.15); }
.ext-debito  { background: rgba(214,48,49,.15); }
.ext-premio  { background: rgba(253,203,110,.15); }
.ext-saque   { background: rgba(116,185,255,.15); }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
/* LOGIN */
.login-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 500; padding: 20px;
}
.login-card {
  width: 100%; max-width: 360px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 32px 24px; text-align: center;
}
.login-logo { font-size: 1.6rem; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
.login-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 24px; }
.login-error {
  color: var(--red); font-size: 0.8rem; margin-top: 10px; min-height: 1.2em;
}
.logout-btn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  border-radius: 8px; padding: 6px 10px; font-size: 0.7rem; cursor: pointer;
}
@media (min-width: 520px) {
  body { max-width: 520px; margin: 0 auto; }
  .modal { border-radius: 20px; margin-bottom: 20px; }
}
</style>
</head>
<body>

<!-- ======= LOGIN ======= -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">N-Chances</div>
    <div class="login-sub">Faça login para acessar o sistema</div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input class="form-control" id="login-email" type="email" placeholder="seu@email.com" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input class="form-control" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ======= APP ======= -->
<div id="app" style="display:none">

<div class="header">
  <div>
    <h1>N-Chances</h1>
    <div class="subtitle">Sistema de Bolões</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div id="header-badge"></div>
    <button class="logout-btn" onclick="doLogout()">Sair</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ======= PAGE: DASHBOARD ======= -->
<div class="page active" id="page-dash">
  <div class="stats" id="stats-row">
    <div class="stat-card"><div class="stat-val" id="stat-boloes">—</div><div class="stat-lbl">Bolões Abertos</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-pendentes">—</div><div class="stat-lbl">Pagtos Pendentes</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-saques">—</div><div class="stat-lbl">Saques Pend.</div></div>
  </div>
  <div id="dash-boloes-list"></div>
</div>

<!-- ======= PAGE: BOLÕES ======= -->
<div class="page" id="page-boloes">
  <div class="tabs" id="boloes-tabs">
    <button class="tab-btn active" onclick="filterBoloes('todos')">Todos</button>
    <button class="tab-btn" onclick="filterBoloes('ABERTO')">Abertos</button>
    <button class="tab-btn" onclick="filterBoloes('FECHADO')">Fechados</button>
    <button class="tab-btn" onclick="filterBoloes('SORTEADO')">Sorteados</button>
  </div>
  <div id="boloes-list"></div>
  <button class="fab" onclick="openModal('modal-novo-bolao')">+</button>
</div>

<!-- ======= PAGE: CLIENTES ======= -->
<div class="page" id="page-clientes">
  <div class="search-box">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="busca-cliente" placeholder="Buscar cliente..." oninput="filterClientes()">
  </div>
  <div id="clientes-list"></div>
</div>

<!-- ======= PAGE: SAQUES ======= -->
<div class="page" id="page-saques">
  <div class="tabs">
    <button class="tab-btn active" onclick="filterSaques('pendente')">Pendentes</button>
    <button class="tab-btn" onclick="filterSaques('aprovado')">Aprovados</button>
    <button class="tab-btn" onclick="filterSaques('pago')">Pagos</button>
  </div>
  <div id="saques-list"></div>
</div>

<!-- ======= NAV ======= -->
<nav class="nav">
  <button class="nav-btn active" onclick="goPage('dash')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Dashboard
  </button>
  <button class="nav-btn" onclick="goPage('boloes')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
    Bolões
  </button>
  <button class="nav-btn" onclick="goPage('clientes')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Clientes
  </button>
  <button class="nav-btn" onclick="goPage('saques')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 1 0 0 7h5a3.5 3.5 0 1 1 0 7H6"/></svg>
    Saques
  </button>
</nav>

<!-- ===== MODALS ===== -->

<!-- Modal: Novo Bolão -->
<div class="modal-overlay" id="modal-novo-bolao">
  <div class="modal">
    <div class="modal-title">Novo Bolão</div>
    <div class="form-group">
      <label class="form-label">Nome do Bolão</label>
      <input class="form-control" id="nb-nome" placeholder="Ex: Mega-Sena #2780">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label class="form-label">Loteria</label>
        <select class="form-control" id="nb-loteria">
          <option value="mega-sena">Mega-Sena</option>
          <option value="lotofacil">Lotofácil</option>
          <option value="quina">Quina</option>
          <option value="lotomania">Lotomania</option>
          <option value="dupla-sena">Dupla Sena</option>
          <option value="timemania">Timemania</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Tipo de Sorteio</label>
        <select class="form-control" id="nb-tipo-sorteio">
          <option value="acumulado">Acumulado</option>
          <option value="simples">Simples</option>
          <option value="surpresinha">Surpresinha</option>
          <option value="teimosinha">Teimosinha</option>
          <option value="especial">Especial</option>
        </select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label class="form-label">Concurso Nº</label>
        <input class="form-control" id="nb-concurso" type="number" placeholder="2780">
      </div>
      <div class="form-group">
        <label class="form-label">Data do Sorteio</label>
        <input class="form-control" id="nb-data" type="date">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label class="form-label">Valor por Cota (R$)</label>
        <input class="form-control" id="nb-valor" type="number" step="0.01" placeholder="10.00">
      </div>
      <div class="form-group">
        <label class="form-label">Valor da Meia Cota (R$)</label>
        <input class="form-control" id="nb-meia-cota" type="number" step="0.01" placeholder="5.00">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Nº de Cotas</label>
      <input class="form-control" id="nb-cotas" type="number" value="1">
    </div>
    <div class="form-group">
      <label class="form-label">Observação</label>
      <input class="form-control" id="nb-obs" placeholder="Opcional">
    </div>
    <button class="btn btn-primary btn-block" onclick="criarBolao()">Criar Bolão</button>
    <div style="height:10px"></div>
    <button class="btn btn-block" style="background:var(--border);color:var(--muted)" onclick="closeModal('modal-novo-bolao')">Cancelar</button>
  </div>
</div>

<!-- Modal: Detalhes do Bolão -->
<div class="modal-overlay" id="modal-bolao-det">
  <div class="modal" id="modal-bolao-det-content">
    <!-- preenchido dinamicamente -->
  </div>
</div>

<!-- Modal: Editar Bolão -->
<div class="modal-overlay" id="modal-editar-bolao">
  <div class="modal">
    <div class="modal-title">Editar Bolão</div>
    <input type="hidden" id="eb-id">
    <div class="form-group">
      <label class="form-label">Nome do Bolão</label>
      <input class="form-control" id="eb-nome">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label class="form-label">Loteria</label>
        <select class="form-control" id="eb-loteria">
          <option value="mega-sena">Mega-Sena</option>
          <option value="lotofacil">Lotofácil</option>
          <option value="quina">Quina</option>
          <option value="lotomania">Lotomania</option>
          <option value="dupla-sena">Dupla Sena</option>
          <option value="timemania">Timemania</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Tipo de Sorteio</label>
        <select class="form-control" id="eb-tipo-sorteio">
          <option value="acumulado">Acumulado</option>
          <option value="simples">Simples</option>
          <option value="surpresinha">Surpresinha</option>
          <option value="teimosinha">Teimosinha</option>
          <option value="especial">Especial</option>
        </select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label class="form-label">Concurso Nº</label>
        <input class="form-control" id="eb-concurso" type="number">
      </div>
      <div class="form-group">
        <label class="form-label">Data do Sorteio</label>
        <input class="form-control" id="eb-data" type="date">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label class="form-label">Valor por Cota (R$)</label>
        <input class="form-control" id="eb-valor" type="number" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">Valor da Meia Cota (R$)</label>
        <input class="form-control" id="eb-meia-cota" type="number" step="0.01">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label class="form-label">Nº de Cotas</label>
        <input class="form-control" id="eb-cotas" type="number">
      </div>
      <div class="form-group">
        <label class="form-label">Prêmio Ganho (R$)</label>
        <input class="form-control" id="eb-premio" type="number" step="0.01">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Observação</label>
      <input class="form-control" id="eb-obs" placeholder="Opcional">
    </div>
    <button class="btn btn-primary btn-block" onclick="salvarEdicaoBolao()">Salvar Alterações</button>
    <div style="height:10px"></div>
    <button class="btn btn-block" style="background:var(--border);color:var(--muted)" onclick="closeModal('modal-editar-bolao')">Cancelar</button>
  </div>
</div>

<!-- Modal: Adicionar Participante -->
<div class="modal-overlay" id="modal-add-part">
  <div class="modal">
    <div class="modal-title">Adicionar Participante</div>
    <input type="hidden" id="ap-bolao-id">
    <input type="hidden" id="ap-telefone">
    <input type="hidden" id="ap-valor-cota">
    <input type="hidden" id="ap-valor-meia">
    <div class="form-group">
      <label class="form-label">Cliente</label>
      <input class="form-control" id="ap-busca" placeholder="Buscar por nome ou telefone..." oninput="filtrarApClientes()">
      <div id="ap-selecionado" style="display:none;margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(46,213,115,.12);color:var(--green);font-size:.8rem;font-weight:600"></div>
      <div class="picker-list" id="ap-clientes-list" onclick="onPickApCliente(event)"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label class="form-label">Cotas</label>
        <input class="form-control" id="ap-cotas" type="number" value="1" min="0.5" step="0.5" oninput="atualizarValorParticipante()">
      </div>

function openModal(id) {

// ============================================================

function toast(msg, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (error ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ============================================================
// HELPERS
// ============================================================
const fmtMoeda = v => 'R$ ' + parseFloat(v||0).toFixed(2).replace('.', ',');
const fmtData  = d => d ? new Date(d).toLocaleDateString('pt-BR') : '—';
const initials = n => (n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();

// Calcula o valor de N cotas (aceita meia cota, ex: 1.5) somando o preço
// das cotas inteiras com o preço da meia cota do bolão (que pode ser
// diferente da metade do valor da cota inteira).
function calcularValorPorCotas(cotas, valorInteira, valorMeia) {
  cotas = parseFloat(cotas) || 0;
  const inteiras = Math.floor(cotas + 1e-9);
  const fracao = Math.round((cotas - inteiras) * 10) / 10;
  return inteiras * (parseFloat(valorInteira) || 0) + (fracao >= 0.5 ? (parseFloat(valorMeia) || 0) : 0);
}

function statusBadge(s) {
  const map = {
    ABERTO:   ['badge-green','Aberto'],
    FECHADO:  ['badge-yellow','Fechado'],
    SORTEADO: ['badge-blue','Sorteado'],
    pago:     ['badge-green','Pago'],
    pendente: ['badge-yellow','Pendente'],
    aprovado: ['badge-blue','Aprovado'],
    rejeitado:['badge-red','Rejeitado'],
  };
  const [cls, lbl] = map[s] || ['badge-blue', s];
  return `<span class="badge ${cls}">${lbl}</span>`;
}

}

async function loadBoloes() {

}

  currentBolaoFilter = status;
  document.querySelectorAll('#boloes-tabs .tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['todos','ABERTO','FECHADO','SORTEADO'][i] === status);
  });
  renderBoloes();
}

function renderBoloes() {
  const list = currentBolaoFilter === 'todos'
    ? allBoloes
    : allBoloes.filter(b => b.status === currentBolaoFilter);
  const container = document.getElementById('boloes-list');
  if (!list.length) {
    container.innerHTML = '<div class="loading">Nenhum bolão encontrado.</div>';
    return;
  }
  container.innerHTML = list.map(b => `
    <div class="card" onclick="abrirBolao('${b.id}')">

        <div>
          <div class="card-title">${b.nome || b.loteria || 'Bolão'}</div>

        </div>
        ${statusBadge(b.status)}
      </div>
      <div style="display:flex;gap:16px;font-size:.8rem;color:var(--muted);margin-top:6px;flex-wrap:wrap">
        <span>Concurso: #${b.concurso || '—'}</span>
        <span>Cota: ${fmtMoeda(b.valor_cota_inteira)}</span>
        <span>Meia: ${fmtMoeda(b.valor_cota_meia)}</span>
        <span>Cotas: ${b.cotas_disponiveis ?? '—'}/${b.quantidade_cotas || '—'}</span>
      </div>
    </div>
  `).join('');
}

async function criarBolao() {
  const nome         = document.getElementById('nb-nome').value.trim();
  const loteria      = document.getElementById('nb-loteria').value;
  const tipoSorteio  = document.getElementById('nb-tipo-sorteio').value;
  const concurso     = document.getElementById('nb-concurso').value;
  const data         = document.getElementById('nb-data').value;
  const valor        = parseFloat(document.getElementById('nb-valor').value) || 0;
  const meiaCota     = parseFloat(document.getElementById('nb-meia-cota').value) || 0;
  const cotas        = parseInt(document.getElementById('nb-cotas').value) || 1;
  const obs          = document.getElementById('nb-obs').value.trim();
  if (!nome) { toast('Informe o nome do bolão', true); return; }
  if (!concurso) { toast('Informe o número do concurso', true); return; }
  if (!data) { toast('Informe a data do sorteio', true); return; }
  const { error } = await sb.from('boloes').insert({
    nome, loteria, tipo_sorteio: tipoSorteio,
    concurso: parseInt(concurso),
    data_sorteio: data,
    valor_cota_inteira: valor, valor_cota_meia: meiaCota, quantidade_cotas: cotas,
    status: 'ABERTO', observacao: obs || null,
  });
  if (error) { toast('Erro: ' + error.message, true); return; }
  toast('Bolão criado!');
  closeModal('modal-novo-bolao');
  loadBoloes();
  // limpar form
  ['nb-nome','nb-concurso','nb-data','nb-valor','nb-meia-cota','nb-obs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('nb-cotas').value = '1';
}

// DETALHE DO BOLÃO

    </div>` : ''}
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">

async function updateBolaoStatus(id, status) {
  const { error } = await sb.from('boloes').update({ status }).eq('id', id);
  if (error) { toast('Erro: ' + error.message, true); return; }
  toast('Status atualizado!');
  closeModal('modal-bolao-det');
  loadBoloes();
  loadDashboard();
}

async function marcarPago(partId, bolaoId) {
  const p = currentBolaoParts.find(x => x.id === partId);
  const { error } = await sb.from('participacoes').update({
    status_pagamento: 'pago', pago_em: new Date().toISOString()
  }).eq('id', partId);
  if (error) { toast('Erro: ' + error.message, true); return; }
  if (p) {
    const bolao = allBoloes.find(b => b.id === bolaoId);
    await reconciliarExtratoDebito(p.telefone, bolaoId, 'pago', p.valor_total, bolao?.nome);
  }
  toast('Pagamento confirmado!');
  abrirBolao(bolaoId);
  loadDashboard();
}

// Garante que o extrato reflita o status de pagamento atual da participação:
// 'pago' -> existe um lançamento de débito com o valor correto;
// 'pendente' -> nenhum lançamento de débito para esse bolão/cliente.
async function reconciliarExtratoDebito(telefone, bolaoId, statusPagamento, valorTotal, bolaoNome) {
  const { data: existentes } = await sb.from('extrato').select('id,valor')
    .eq('telefone', telefone).eq('bolao_id', bolaoId).eq('tipo', 'debito');
  const existente = (existentes || [])[0];
  if (statusPagamento === 'pago') {
    if (existente) {
      if (Number(existente.valor) !== Number(valorTotal)) {
        await sb.from('extrato').update({ valor: valorTotal }).eq('id', existente.id);
      }
    } else {
      await sb.from('extrato').insert({
        telefone, tipo: 'debito', valor: valorTotal,
        descricao: `Participação bolão ${bolaoNome || bolaoId}`,
        bolao_id: bolaoId,
      });
    }
  } else if (existente) {
    await sb.from('extrato').delete().eq('id', existente.id);
  }
}

// ============================================================
// FECHAR BOLÃO (com checagem de pagamentos pendentes)
// ============================================================
function confirmarFecharBolao(id) {
  const pendentes = currentBolaoParts.filter(p => p.status_pagamento === 'pendente');
  if (pendentes.length > 0) {
    const ok = confirm(
      `Atenção: existem ${pendentes.length} pagamento(s) pendente(s) neste bolão.\n\n` +
      `Deseja realmente encerrar mesmo assim?`
    );
    if (!ok) return;
  }
  updateBolaoStatus(id, 'FECHADO');
}

// ============================================================
// MARCAR SORTEADO + DISTRIBUIÇÃO DE PRÊMIO
// ============================================================
async function marcarSorteado(id) {
  const premiado = confirm('Este bolão foi premiado?');
  let premioTotal = 0;

  if (premiado) {
    const valorStr = prompt('Qual foi o valor total do prêmio (R$)?');
    if (valorStr === null) return;
    premioTotal = parseFloat(valorStr.replace(',', '.'));
    if (isNaN(premioTotal) || premioTotal <= 0) { toast('Valor de prêmio inválido', true); return; }

    const pagantes = currentBolaoParts.filter(p => p.status_pagamento === 'pago');
    if (!pagantes.length) {
      toast('Nenhum participante pago para receber o prêmio', true);
      return;
    }
    const totalCotas = pagantes.reduce((s,p) => s + (p.cotas || 0), 0);
    const bolao = allBoloes.find(b => b.id === id);
    let somaDistribuida = 0;
    const lancamentos = pagantes.map((p, idx) => {
      let valor;
      if (idx === pagantes.length - 1) {
        valor = Math.round((premioTotal - somaDistribuida) * 100) / 100;
      } else {
        valor = Math.round(premioTotal * (p.cotas / totalCotas) * 100) / 100;
        somaDistribuida += valor;
      }
      return {
        telefone: p.telefone, tipo: 'premio', valor,
        descricao: `Prêmio - ${bolao?.nome || 'Bolão'} (Concurso #${bolao?.concurso || '—'})`,
        bolao_id: id,
      };
    });
    const { error: errExt } = await sb.from('extrato').insert(lancamentos);
    if (errExt) { toast('Erro ao lançar prêmios: ' + errExt.message, true); return; }
  }

  const { error } = await sb.from('boloes').update({
    status: 'SORTEADO',
    premio_ganho: premiado ? premioTotal : 0,
  }).eq('id', id);
  if (error) { toast('Erro: ' + error.message, true); return; }
  toast(premiado ? 'Bolão premiado! Prêmios distribuídos no extrato.' : 'Bolão marcado como sorteado.');
  closeModal('modal-bolao-det');
  loadBoloes();
  loadDashboard();
}

async function salvarEdicaoBolao() {

  const nome        = document.getElementById('eb-nome').value.trim();
  const loteria     = document.getElementById('eb-loteria').value;
  const tipoSorteio = document.getElementById('eb-tipo-sorteio').value;
  const concurso    = document.getElementById('eb-concurso').value;
  const data        = document.getElementById('eb-data').value;
  const valor       = parseFloat(document.getElementById('eb-valor').value) || 0;
  const meiaCota    = parseFloat(document.getElementById('eb-meia-cota').value) || 0;

    premio_ganho: premio, observacao: obs || null,

// ============================================================
// EXCLUIR BOLÃO (com double-check e limpeza no extrato)
// ============================================================
async function confirmarExcluirBolao(id) {
  const bolao = allBoloes.find(b => b.id === id);
  const nomeBolao = bolao?.nome || bolao?.loteria || 'este bolão';

  const digitado = prompt(
    `Isso vai EXCLUIR PERMANENTEMENTE o bolão "${nomeBolao}", todos os participantes ` +
    `e todos os lançamentos do extrato relacionados a ele (inclusive prêmios já creditados). ` +
    `Os saldos dos clientes serão recalculados sem esses lançamentos.\n\n` +
    `Esta ação NÃO PODE SER DESFEITA.\n\n` +
    `Para confirmar, digite o nome do bolão exatamente como abaixo:\n${nomeBolao}`
  );
  if (digitado === null) return;
  if (digitado.trim() !== nomeBolao) {
    toast('Nome não confere. Exclusão cancelada.', true);
    return;
  }
  if (!confirm(`Tem certeza? Excluir "${nomeBolao}" definitivamente?`)) return;

  const { error: errExt } = await sb.from('extrato').delete().eq('bolao_id', id);
  if (errExt) { toast('Erro ao excluir extrato: ' + errExt.message, true); return; }

  const { error: errBol } = await sb.from('boloes').delete().eq('id', id);
  if (errBol) { toast('Erro ao excluir bolão: ' + errBol.message, true); return; }

  toast('Bolão excluído.');
  closeModal('modal-bolao-det');
  loadBoloes();
  loadDashboard();
}

async function adicionarParticipante() {
  const bolaoId = document.getElementById('ap-bolao-id').value;
  const tel     = document.getElementById('ap-telefone').value;
  if (!tel) { toast('Selecione um cliente', true); return; }
  const cotas   = parseFloat(document.getElementById('ap-cotas').value) || 0;
  const valor   = parseFloat(document.getElementById('ap-valor').value) || 0;
  const status  = document.getElementById('ap-status').value;
  if (cotas <= 0) { toast('Informe a quantidade de cotas (mín. 0,5)', true); return; }
  if (valor <= 0) { toast('Informe o valor total', true); return; }
  const bolaoCheck = allBoloes.find(b => b.id === bolaoId);
  if (bolaoCheck?.quantidade_cotas) {
    const somaAtual = currentBolaoParts.reduce((s,p) => s + (parseFloat(p.cotas) || 0), 0);
    if (somaAtual + cotas > bolaoCheck.quantidade_cotas + 1e-9) {
      toast(`Limite de cotas excedido (${somaAtual}/${bolaoCheck.quantidade_cotas} já preenchidas)`, true);
      return;
    }
  }
  const { error } = await sb.from('participacoes').insert({
    bolao_id: bolaoId, telefone: tel, cotas, valor_total: valor,
    status_pagamento: status,
    pago_em: status === 'pago' ? new Date().toISOString() : null,
  });
  if (error) { toast('Erro: ' + error.message, true); return; }
  if (status === 'pago') {
    const bolao = allBoloes.find(b => b.id === bolaoId);
    const cliente = allClientes.find(c => c.telefone === tel);
    await sb.from('extrato').insert({
      telefone: tel, tipo: 'debito', valor,
      descricao: `Participação bolão ${bolao?.nome || bolaoId}`,
      bolao_id: bolaoId,
    });
  }
  toast('Participante adicionado!');
  closeModal('modal-add-part');
  abrirBolao(bolaoId);
  loadDashboard();
}

  document.getElementById('epart-id').value = p.id;

  document.getElementById('epart-cotas').value = p.cotas;
  document.getElementById('epart-valor').value = p.valor_total;
  document.getElementById('epart-status').value = p.status_pagamento;
  closeModal('modal-bolao-det');

  const valorCota = document.getElementById('epart-valor-cota').value;
  const valorMeia = document.getElementById('epart-valor-meia').value;
  document.getElementById('epart-valor').value = calcularValorPorCotas(cotas, valorCota, valorMeia).toFixed(2);
}

async function salvarEdicaoPart() {
  const id      = document.getElementById('epart-id').value;
  const bolaoId = document.getElementById('epart-bolao-id').value;
  const cotas   = parseFloat(document.getElementById('epart-cotas').value) || 0;
  const valor   = parseFloat(document.getElementById('epart-valor').value) || 0;
  const status  = document.getElementById('epart-status').value;
  const p = currentBolaoParts.find(x => x.id === id);
  if (!p) return;
  if (cotas <= 0) { toast('Informe a quantidade de cotas (mín. 0,5)', true); return; }
  if (valor <= 0) { toast('Informe o valor total', true); return; }
  const bolaoCheck = allBoloes.find(b => b.id === bolaoId);
  if (bolaoCheck?.quantidade_cotas) {
    const somaOutros = currentBolaoParts.filter(x => x.id !== id).reduce((s,x) => s + (parseFloat(x.cotas) || 0), 0);
    if (somaOutros + cotas > bolaoCheck.quantidade_cotas + 1e-9) {
      toast(`Limite de cotas excedido (${somaOutros}/${bolaoCheck.quantidade_cotas} já preenchidas pelos demais)`, true);
      return;
    }
  }

  const updates = { cotas, valor_total: valor, status_pagamento: status };
  if (status === 'pago' && !p.pago_em) updates.pago_em = new Date().toISOString();
  if (status === 'pendente') updates.pago_em = null;

  const { error } = await sb.from('participacoes').update(updates).eq('id', id);
  if (error) { toast('Erro: ' + error.message, true); return; }

  const bolao = allBoloes.find(b => b.id === bolaoId);
  await reconciliarExtratoDebito(p.telefone, bolaoId, status, valor, bolao?.nome);

  toast('Participação atualizada!');
  closeModal('modal-editar-part');
  abrirBolao(bolaoId);
  loadDashboard();
}

async function renderClientes(list) {

// EXTRATO
// ============================================================
async function abrirExtrato(telefone, nome) {
  const modal = document.getElementById('modal-extrato-content');
  modal.innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>';
  openModal('modal-extrato');

  const [extratoRes, saldoRes] = await Promise.all([
    sb.from('extrato').select('*').eq('telefone', telefone).order('criado_em', {ascending: false}).limit(30),
    sb.from('saldo_clientes').select('*').eq('telefone', telefone).single(),
  ]);

  const items   = extratoRes.data || [];
  const saldo   = saldoRes.data?.saldo || 0;
  const saldoCls = saldo >= 0 ? 'text-green' : 'text-red';
  const extIcons = { credito:'💰', debito:'📤', premio:'🏆', saque:'🏧' };
  const extCls   = { credito:'ext-credito', debito:'ext-debito', premio:'ext-premio', saque:'ext-saque' };

  modal.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="modal-title">${nome}</div>
      <button onclick="closeModal('modal-extrato')" style="background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer">×</button>
    </div>
    <div class="card" style="margin-bottom:16px;text-align:center">
      <div style="font-size:.75rem;color:var(--muted);margin-bottom:4px">SALDO ATUAL</div>
      <div class="${saldoCls}" style="font-size:1.8rem;font-weight:800">${fmtMoeda(saldo)}</div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="abrirLancamento('${telefone}')">+ Lançamento</button>
      <button class="btn btn-sm" style="background:var(--accent2);color:#74b9ff" onclick="abrirSolicitarSaque('${telefone}','${nome}')">Solicitar Saque</button>
    </div>
    <div class="divider"></div>
    ${items.length === 0 ? '<div style="color:var(--muted);font-size:.85rem;text-align:center;padding:20px">Nenhum lançamento</div>' :
      items.map(e => `
        <div class="list-item">
          <div class="ext-icon ${extCls[e.tipo]||'ext-credito'}">${extIcons[e.tipo]||'💲'}</div>
          <div class="item-info">
            <div class="item-name">${e.descricao || e.tipo}</div>
            <div class="item-detail">${fmtData(e.criado_em)}</div>
          </div>
          <div class="item-value ${e.tipo==='credito'||e.tipo==='premio' ? 'text-green' : 'text-red'}">
            ${e.tipo==='credito'||e.tipo==='premio' ? '+' : '-'}${fmtMoeda(e.valor)}
          </div>
        </div>
      `).join('')
    }
  `;
}

  closeModal('modal-extrato');
